name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # redis-stack-server provides RediSearch, which the index tests need.
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          # The chunking tests tokenise for real, so the model must be present.
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run tests
        env:
          REDIRECALL_TEST_REDIS_HOST: 127.0.0.1
          REDIRECALL_TEST_REDIS_PORT: 6390
        run: python -m pytest tests/ -q --durations=10

      - name: Check the app imports and the CLI is wired
        # Wrapped in `timeout`: cli() once ignored sys.argv and started a server
        # on --help, which blocked this step for 22 minutes until the job-level
        # timeout cancelled the whole run. A hang here must fail in seconds.
        run: |
          timeout 60 python -c "import redirecall.main; print('import ok')"
          timeout 60 redirecall --help > /dev/null && echo "cli ok"
          timeout 60 redirecall --version
