# RediRecall behind Caddy with automatic HTTPS (Let's Encrypt).
#
#   1. Point your domain's DNS at this host; open ports 80 and 443.
#   2. Edit deploy/Caddyfile — replace redirecall.example.com with your domain.
#   3. From the repo root:  docker compose -f deploy/docker-compose.https.yml up -d
#   4. Open https://your-domain — Caddy fetches the certificate on first request.
#
# RediRecall itself is NOT published on the host here; only Caddy is exposed, so
# the only way in is through TLS. (There is still no app-level auth — add it, or
# an auth layer in the Caddyfile, before exposing sensitive data.)

services:
  redirecall:
    # Prebuilt multi-arch image from GitHub's registry (or build from source: `build: ..`).
    image: ghcr.io/sfcyris/redirecall:latest
    # build: ..
    container_name: redirecall
    volumes:
      - redirecall-data:/data
    environment:
      - REDIRECALL_DATA_DIR=/data
      - REDIRECALL_HOST=0.0.0.0
      - REDIRECALL_PORT=8420
      - REDIRECALL_REDIS_HOST=redis
      - REDIRECALL_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8420"            # reachable only on the internal compose network
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: redirecall-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redirecall-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: redirecall-caddy
    depends_on:
      - redirecall
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  redirecall-data:
  redirecall-redis:
  caddy-data:
  caddy-config:
